[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mountassir-core"
version = "0.1.0"
description = "MOUNTASSIR CORE — sovereign personal memory with provenance, classification and an MCP gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — all rights reserved" }
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "mcp>=1.2"]

[project.scripts]
mcore = "mountassir_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mountassir_core = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
