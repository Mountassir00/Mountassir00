[project]
name = "mountassir-one"
version = "0.1.0"
description = "MOUNTASSIR ONE — fondations V0 : classification, politiques de divulgation, mémoire gouvernée, autonomie, audit."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
