<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" width="420mm" height="297mm" role="img" aria-labelledby="t d">
  <title id="t">SIG-02 — Plaque de numéro de grille (A3 paysage, 420 x 297 mm)</title>
  <desc id="d">Maquette originale EVENT LAB. Plaque d'équipe affichée au pit wall puis posée sur l'emplacement de la grille au sol pour la photo officielle. Numéro de grille, catégorie, poule, temps retenu. Données fictives.</desc>
  <rect width="420" height="297" fill="#121417"/>
  <!-- bandeau supérieur -->
  <g transform="translate(16 14) scale(0.22)" fill="none" stroke="#F4F1EA" stroke-width="5">
    <rect x="0" y="0" width="40" height="24" rx="5" fill="#FFC629" stroke="#FFC629"/>
    <rect x="0" y="34" width="40" height="24" rx="5"/><rect x="0" y="68" width="40" height="24" rx="5"/>
    <rect x="50" y="12" width="40" height="24" rx="5"/><rect x="50" y="46" width="40" height="24" rx="5"/><rect x="50" y="80" width="40" height="24" rx="5"/>
    <rect x="100" y="24" width="40" height="24" rx="5"/><rect x="100" y="58" width="40" height="24" rx="5"/><rect x="100" y="92" width="40" height="24" rx="5"/>
  </g>
  <text x="54" y="30" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="14" fill="#F4F1EA">LA GRILLE 3x3</text>
  <rect x="300" y="14" width="104" height="24" rx="4" fill="#FF5B1A"/>
  <text x="352" y="31" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="13" fill="#121417">OPEN</text>
  <!-- numéro -->
  <text x="20" y="215" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="190" fill="#F4F1EA" textLength="250" lengthAdjust="spacingAndGlyphs">07</text>
  <text x="22" y="60" font-family="Archivo, Arial, sans-serif" font-size="11" fill="#8B9099">POSITION SUR LA GRILLE</text>
  <!-- colonne droite -->
  <text x="290" y="92" font-family="Archivo, Arial, sans-serif" font-size="11" fill="#8B9099">POULE</text>
  <text x="290" y="132" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="44" fill="#FFC629">B</text>
  <text x="290" y="162" font-family="Archivo, Arial, sans-serif" font-size="11" fill="#8B9099">TEMPS RETENU (Q2)</text>
  <text x="290" y="186" font-family="IBM Plex Mono, Courier New, monospace" font-size="22" font-weight="700" fill="#F4F1EA">00:43.02</text>
  <!-- bandeau nom d'équipe -->
  <rect x="0" y="240" width="420" height="57" fill="#F4F1EA"/>
  <text x="20" y="278" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="28" fill="#121417">NOM D'ÉQUIPE</text>
  <text x="400" y="278" text-anchor="end" font-family="Archivo, Arial, sans-serif" font-size="11" fill="#3A3F47">Données fictives</text>
</svg>
