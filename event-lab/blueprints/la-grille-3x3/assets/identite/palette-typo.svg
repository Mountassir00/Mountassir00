<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="t d">
  <title id="t">LA GRILLE 3x3 — palette chromatique et typographies</title>
  <desc id="d">Planche originale EVENT LAB. Sept couleurs avec valeurs HEX, RVB et CMJN indicatives, couples texte/fond avec ratios de contraste WCAG calculés, spécimens typographiques Archivo Black, Archivo et IBM Plex Mono (licences à confirmer).</desc>
  <rect width="1200" height="1000" fill="#F4F1EA"/>
  <text x="40" y="56" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="30" fill="#121417">PALETTE &amp; TYPOGRAPHIES</text>
  <text x="40" y="82" font-family="Archivo, Arial, sans-serif" font-size="15" fill="#3A3F47">CMJN : conversion mathématique indicative, à valider par épreuve imprimeur. Ratios : formule de luminance relative WCAG 2.x, calculés par script.</text>
  <g font-family="Archivo, Arial, sans-serif" font-size="12" fill="#121417">
    <g transform="translate(40 110)">
      <rect width="150" height="120" fill="#121417"/>
      <text y="146" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="15">ASPHALTE</text>
      <text y="166">#121417</text><text y="183">RVB 18 20 23</text><text y="200">CMJN ~22 13 0 91</text><text y="217">Fonds, textes, traits</text>
    </g>
    <g transform="translate(200 110)">
      <rect width="150" height="120" fill="#F4F1EA" stroke="#121417" stroke-width="2"/>
      <text y="146" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="15">CRAIE</text>
      <text y="166">#F4F1EA</text><text y="183">RVB 244 241 234</text><text y="200">CMJN ~0 1 4 4</text><text y="217">Fonds clairs, inversés</text>
    </g>
    <g transform="translate(360 110)">
      <rect width="150" height="120" fill="#FF5B1A"/>
      <text y="146" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="15">ORANGE SIGNAL</text>
      <text y="166">#FF5B1A</text><text y="183">RVB 255 91 26</text><text y="200">CMJN ~0 64 90 0</text><text y="217">Accent, pastille 3x3</text>
    </g>
    <g transform="translate(520 110)">
      <rect width="150" height="120" fill="#FFC629"/>
      <text y="146" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="15">JAUNE POLE</text>
      <text y="166">#FFC629</text><text y="183">RVB 255 198 41</text><text y="200">CMJN ~0 22 84 0</text><text y="217">Pole, chronos, n° 1</text>
    </g>
    <g transform="translate(680 110)">
      <rect width="150" height="120" fill="#2D55E6"/>
      <text y="146" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="15">BLEU PISTE</text>
      <text y="166">#2D55E6</text><text y="183">RVB 45 85 230</text><text y="200">CMJN ~80 63 0 10</text><text y="217">Information, liens</text>
    </g>
    <g transform="translate(840 110)">
      <rect width="150" height="120" fill="#8B9099"/>
      <text y="146" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="15">GRIS BÉTON</text>
      <text y="166">#8B9099</text><text y="183">RVB 139 144 153</text><text y="200">CMJN ~9 6 0 40</text><text y="217">Texte 2nd sur sombre</text>
    </g>
    <g transform="translate(1000 110)">
      <rect width="150" height="120" fill="#3A3F47"/>
      <text y="146" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="15">GRIS LIGNE</text>
      <text y="166">#3A3F47</text><text y="183">RVB 58 63 71</text><text y="200">CMJN ~18 11 0 72</text><text y="217">Cartes, séparateurs</text>
    </g>
  </g>

  <text x="40" y="364" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="20" fill="#121417">COUPLES TEXTE / FOND</text>
  <g font-family="Archivo, Arial, sans-serif" font-size="15">
    <g transform="translate(40 384)">
      <rect width="260" height="56" fill="#121417"/><text x="14" y="35" fill="#F4F1EA" font-weight="700">Craie sur asphalte</text>
      <text x="270" y="35" fill="#121417">16,36:1 — AAA</text>
    </g>
    <g transform="translate(40 450)">
      <rect width="260" height="56" fill="#121417"/><text x="14" y="35" fill="#FFC629" font-weight="700">Jaune sur asphalte</text>
      <text x="270" y="35" fill="#121417">11,74:1 — AAA</text>
    </g>
    <g transform="translate(40 516)">
      <rect width="260" height="56" fill="#121417"/><text x="14" y="35" fill="#FF5B1A" font-weight="700">Orange sur asphalte</text>
      <text x="270" y="35" fill="#121417">5,94:1 — AA</text>
    </g>
    <g transform="translate(40 582)">
      <rect width="260" height="56" fill="#121417"/><text x="14" y="35" fill="#8B9099" font-weight="700">Gris béton sur asphalte</text>
      <text x="270" y="35" fill="#121417">5,75:1 — AA</text>
    </g>
    <g transform="translate(620 384)">
      <rect width="260" height="56" fill="#FF5B1A"/><text x="14" y="35" fill="#121417" font-weight="700">Asphalte sur orange</text>
      <text x="270" y="35" fill="#121417">5,94:1 — AA</text>
    </g>
    <g transform="translate(620 450)">
      <rect width="260" height="56" fill="#2D55E6"/><text x="14" y="35" fill="#F4F1EA" font-weight="700">Craie sur bleu</text>
      <text x="270" y="35" fill="#121417">5,24:1 — AA</text>
    </g>
    <g transform="translate(620 516)">
      <rect width="260" height="56" fill="#3A3F47"/><text x="14" y="35" fill="#FFC629" font-weight="700">Jaune sur gris ligne</text>
      <text x="270" y="35" fill="#121417">6,74:1 — AA</text>
    </g>
    <g transform="translate(620 582)">
      <rect width="260" height="56" fill="#F4F1EA" stroke="#121417" stroke-width="2"/><text x="14" y="35" fill="#FF5B1A" font-weight="700">Orange sur craie</text>
      <text x="270" y="35" fill="#121417" font-weight="700">2,75:1 — INTERDIT</text>
    </g>
  </g>

  <text x="40" y="690" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="20" fill="#121417">TYPOGRAPHIES</text>
  <g fill="#121417">
    <text x="40" y="748" font-family="Archivo Black, Arial Black, sans-serif" font-weight="900" font-size="48">ARCHIVO BLACK — TITRES</text>
    <text x="40" y="772" font-family="Archivo, Arial, sans-serif" font-size="14" fill="#3A3F47">Titres, numéros de grille, mot-symbole. Repli : Arial Black. Licence : SIL Open Font License (à confirmer sur la page officielle).</text>
    <text x="40" y="822" font-family="Archivo, Arial, sans-serif" font-size="30">Archivo — texte courant, 400 / 600 / 800</text>
    <text x="40" y="846" font-family="Archivo, Arial, sans-serif" font-size="14" fill="#3A3F47">Corps de texte ≥ 16 px à l'écran, ≥ 9 pt imprimé ; signalétique : voir section 19. Repli : Arial. Licence : OFL (à confirmer).</text>
    <text x="40" y="900" font-family="IBM Plex Mono, Courier New, monospace" font-size="36" font-weight="700">00:41.32  +0.24  P01</text>
    <text x="40" y="924" font-family="Archivo, Arial, sans-serif" font-size="14" fill="#3A3F47">IBM Plex Mono : chronos et classements (chiffres à chasse fixe). Repli : Courier New. Licence : OFL (à confirmer).</text>
  </g>
  <text x="40" y="975" font-family="Archivo, Arial, sans-serif" font-size="12" fill="#3A3F47">Fichier de travail : les textes doivent être vectorisés (contours) avant envoi à l'imprimeur.</text>
</svg>
