  <title id="t">LA GRILLE 3x3 — icône / avatar</title>
  <desc id="d">Création originale EVENT LAB. Marque seule (grille 3x3 décalée, pole jaune) sur fond asphalte, inscrite dans le cercle de recadrage des réseaux sociaux (rayon 230 px). Sans texte : lisible jusqu'à 32 px.</desc>
